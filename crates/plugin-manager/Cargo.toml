[package]
name = "spark-plugin-manager"
description = "Discover, load manifests, and lifecycle-manage Spark plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
spark-core = { workspace = true }
spark-ipc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# 插件签名三期：Ed25519 验签 + SHA-256 内容清单。纯 Rust 无 C 依赖。
# 规范见 插件开发/插件签名规范.md。host 只用验签（VerifyingKey/Verifier），
# sign-tool（Phase 2）共用本 crate 的 canon 模块做签名。
ed25519-dalek = "2"
sha2 = "0.10"
base64 = "0.22"
# 二期触发方式 `type: regex`（《插件开发规范》§5.2）：清单 pattern 的加载期编译
# 校验 + 搜索热路径 is_match。regex-lite 与 regex 同语法子集、纯 Rust、无 unicode
# 重表——workspace 离线缓存已有（Cargo.lock 可离线解析）。
regex-lite = "0.1"
