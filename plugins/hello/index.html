<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Hello</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; padding: 20px 22px;
    font: 14px/1.6 "Segoe UI", system-ui, sans-serif;
  }
  h3 { margin: 0 0 12px; font-size: 16px; }
  .row { display: flex; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
  button {
    padding: 6px 14px; border: 1px solid #8884; border-radius: 6px;
    background: #8882; color: inherit; cursor: pointer; font-size: 13px;
  }
  button:hover { background: #8883; }
  code { background: #8882; padding: 1px 5px; border-radius: 4px; }
  #log {
    margin-top: 12px; padding: 8px 10px; min-height: 60px;
    border: 1px solid #8883; border-radius: 6px;
    white-space: pre-wrap; font-family: Consolas, monospace; font-size: 12px;
  }
</style>
</head>
<body>
  <h3>你好，Spark</h3>
  <div>触发关键字：<code id="cmd"></code></div>
  <div>你输入的是：<code id="input"></code></div>

  <div class="row">
    <button id="copy">写入剪贴板</button>
    <button id="paste">读剪贴板</button>
    <button id="notify">发通知</button>
    <button id="save">存 db</button>
    <button id="load">读 db</button>
    <button id="resize">调整窗口</button>
    <button id="close">关闭</button>
  </div>

  <div id="log"></div>

<script>
  const $ = (id) => document.getElementById(id);
  const log = (msg) => { $('log').textContent = msg; };

  $('cmd').textContent = spark.input.command || '(无)';
  $('input').textContent = spark.input.text || '(空)';

  // 出错时统一展示 error.code，方便对照规范 §8.6
  const run = (fn) => async () => {
    try { log(await fn() ?? '完成'); }
    catch (e) { log('失败 [' + (e.code || 'ERROR') + '] ' + e.message); }
  };

  $('copy').onclick = run(async () => {
    await spark.clipboard.writeText(spark.input.text || 'Hello Spark');
    return '已写入剪贴板';
  });

  $('paste').onclick = run(async () =>
    '剪贴板内容：' + (await spark.clipboard.readText() || '(空)'));

  $('notify').onclick = run(async () => {
    await spark.notify.show({ title: 'Hello 插件', body: spark.input.text || '来自示例插件' });
    return '已发送通知';
  });

  $('save').onclick = run(async () => {
    await spark.db.set('last', { text: spark.input.text, at: new Date().toISOString() });
    return '已存入 db.last';
  });

  $('load').onclick = run(async () => {
    const v = await spark.db.get('last');
    return v ? 'db.last = ' + JSON.stringify(v) : 'db.last 为空';
  });

  $('resize').onclick = run(async () => {
    await spark.window.resize(560, 460);
    return '已调整为 560×460';
  });

  $('close').onclick = () => spark.window.close();

  spark.onEnter(() => log('插件已就绪'));
  spark.onClose(() => spark.db.set('closed_at', new Date().toISOString()));
</script>
</body>
</html>
