<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spark — UI Prototype</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 仅作预览背景：正式应用只有中间这一扇主窗口 -->
  <div class="desktop" id="desktop">
    <div class="desktop-wallpaper"></div>
    <div class="desktop-hint">
      <kbd>Alt</kbd> + <kbd>Space</kbd> 唤起 · 齿轮 / <kbd>Ctrl</kbd>+<kbd>,</kbd> 设置 · 点击窗外关闭
    </div>

    <!-- ========== 唯一主窗口 ========== -->
    <div class="launcher" id="launcher" role="dialog" aria-label="Spark">
      <div class="launcher-glow"></div>
      <div class="launcher-glass">

        <!-- 模式：搜索 -->
        <div class="mode mode-search" id="modeSearch">
          <div class="search-row">
            <div class="search-icon" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/>
                <path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </div>
            <input
              id="query"
              class="search-input"
              type="text"
              placeholder="搜索应用、文件、命令…"
              autocomplete="off"
              spellcheck="false"
            />
            <div class="search-meta" id="searchMeta">12 项</div>
            <div class="view-toggle" role="group" aria-label="视图切换">
              <button type="button" class="view-btn active" id="viewList" title="列表视图" aria-pressed="true" data-view="list">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                  <rect x="2" y="3" width="12" height="1.8" rx="0.5"/>
                  <rect x="2" y="7.1" width="12" height="1.8" rx="0.5"/>
                  <rect x="2" y="11.2" width="12" height="1.8" rx="0.5"/>
                </svg>
              </button>
              <button type="button" class="view-btn" id="viewGrid" title="平铺视图" aria-pressed="false" data-view="grid">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                  <rect x="2" y="2" width="5" height="5" rx="1"/>
                  <rect x="9" y="2" width="5" height="5" rx="1"/>
                  <rect x="2" y="9" width="5" height="5" rx="1"/>
                  <rect x="9" y="9" width="5" height="5" rx="1"/>
                </svg>
              </button>
            </div>
            <button type="button" class="icon-tool" id="openSettings" title="设置 (Ctrl+,)" aria-label="设置">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                <circle cx="12" cy="12" r="3"/>
                <path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
              </svg>
            </button>
          </div>

          <div class="divider"></div>

          <div class="results results-list" id="results" role="listbox"></div>

          <div class="favorites" id="favorites">
            <div class="fav-top">
              <button type="button" class="fav-toggle" id="favToggle" title="展开/收起收藏" aria-expanded="true" aria-controls="favBody">
                <svg class="fav-chevron" width="12" height="12" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                  <path d="M4.5 6.2L8 9.7l3.5-3.5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <svg class="fav-star" width="12" height="12" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                  <path d="M8 1.5l1.76 3.57 3.94.57-2.85 2.78.67 3.92L8 10.5l-3.52 1.84.67-3.92L2.3 5.64l3.94-.57L8 1.5z"/>
                </svg>
                <span>收藏</span>
                <span class="fav-count" id="favCount"></span>
              </button>
              <div class="fav-groups" id="favGroups" role="tablist"></div>
              <button type="button" class="fav-add-group" id="favAddGroup" title="新建分组">+</button>
            </div>
            <div class="fav-body" id="favBody">
              <div class="fav-body-inner">
                <div class="fav-items" id="favItems" role="list"></div>
              </div>
            </div>
          </div>

          <div class="footer">
            <div class="footer-left">
              <span class="chip">Enter 打开</span>
              <span class="chip">Tab 动作</span>
              <span class="chip">Ctrl+, 设置</span>
            </div>
            <div class="footer-right" id="footerSource">本地 · 极速</div>
          </div>
        </div>

        <!-- 模式：设置（同一主窗口内切换，不是第二个窗） -->
        <div class="mode mode-settings hidden" id="modeSettings">
          <div class="settings-header in-window">
            <button type="button" class="back-btn" id="closeSettings" title="返回搜索">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              返回
            </button>
            <span class="settings-title">设置</span>
            <span class="settings-spacer"></span>
          </div>
          <div class="settings-body in-window">
            <nav class="settings-nav">
              <button class="nav-item active" data-pane="general">通用</button>
              <button class="nav-item" data-pane="hotkey">热键</button>
              <button class="nav-item" data-pane="appearance">外观</button>
              <button class="nav-item" data-pane="plugins">插件</button>
            </nav>
            <div class="settings-panes">
              <section class="pane active" id="pane-general">
                <label class="row"><span>开机启动</span><input type="checkbox" checked /></label>
                <label class="row"><span>失焦时隐藏</span><input type="checkbox" checked /></label>
                <label class="row"><span>执行后隐藏</span><input type="checkbox" checked /></label>
                <p class="hint">系统托盘图标在任务栏通知区域（正式版），不在本窗口内。</p>
              </section>
              <section class="pane" id="pane-hotkey">
                <div class="row">
                  <span>唤起热键</span>
                  <div class="hotkey-presets">
                    <button type="button" class="preset active" data-hk="Alt+Space">Alt + Space</button>
                    <button type="button" class="preset" data-hk="Ctrl+Space">Ctrl + Space</button>
                  </div>
                </div>
                <p class="hint">默认 Alt+Space；冲突时可改 Ctrl+Space。</p>
              </section>
              <section class="pane" id="pane-appearance">
                <div class="row">
                  <span>主题</span>
                  <select id="themeSelect">
                    <option value="system">跟随系统</option>
                    <option value="dark" selected>深色玻璃</option>
                    <option value="light">浅色玻璃</option>
                  </select>
                </div>
                <div class="row">
                  <span>默认视图</span>
                  <select id="defaultView">
                    <option value="list" selected>列表</option>
                    <option value="grid">平铺</option>
                  </select>
                </div>
                <div class="row">
                  <span>窗口宽度</span>
                  <input type="range" id="widthRange" min="560" max="840" value="680" />
                </div>
                <label class="row"><span>减少动画</span><input type="checkbox" id="reduceMotion" /></label>
              </section>
              <section class="pane" id="pane-plugins">
                <div class="plugin-row">
                  <div>
                    <strong>Echo</strong>
                    <small>com.example.echo</small>
                  </div>
                  <label class="switch"><input type="checkbox" checked /><span></span></label>
                </div>
                <div class="plugin-row">
                  <div>
                    <strong>JSON 格式化</strong>
                    <small>需剪贴板权限</small>
                  </div>
                  <label class="switch"><input type="checkbox" checked /><span></span></label>
                </div>
                <button type="button" class="btn-secondary">安装本地插件…</button>
              </section>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- 动作菜单挂在主窗附近 -->
    <div class="action-sheet glass-panel hidden" id="actionSheet">
      <div class="action-title" id="actionTitle">Windows Terminal</div>
      <button type="button" class="action-item active" data-action="open">打开 <span>Enter</span></button>
      <button type="button" class="action-item" data-action="admin">以管理员运行</button>
      <button type="button" class="action-item" data-action="reveal">打开文件位置</button>
      <button type="button" class="action-item" data-action="pin">固定到收藏</button>
      <button type="button" class="action-item" data-action="pin-dev">固定到「开发」</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
