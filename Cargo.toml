[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/ipc",
    "crates/index",
    "crates/plugin-manager",
    "crates/host",
    "crates/sdk",
    "plugins/echo",
]
default-members = ["crates/host"]

[workspace.package]
version = "0.2.8"
edition = "2021"
license = "MIT"
repository = "https://github.com/MrHan-Yd/spark"
authors = ["Spark Contributors"]
rust-version = "1.75"

[workspace.dependencies]
spark-core = { path = "crates/core" }
spark-ipc = { path = "crates/ipc" }
spark-index = { path = "crates/index" }
spark-plugin-manager = { path = "crates/plugin-manager" }
spark-sdk = { path = "crates/sdk" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
